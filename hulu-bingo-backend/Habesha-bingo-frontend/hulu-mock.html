<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hulu Bingo</title>
  <style>
    :root {
      --bg-main: #141824;
      --bg-panel: #1e2332;
      --text-main: #ffffff;
      --text-muted: #8b96a5;
      --gold: #f6c039;
      --green: #4ade80;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #d1d5db;
      color: #000;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: bold;
    }
    .header-bar .live-badge {
      color: #065f46;
      background-color: #a7f3d0;
      padding: 2px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .live-badge::before {
      content: '';
      display: block;
      width: 6px;
      height: 6px;
      background-color: #059669;
      border-radius: 50%;
    }
    .top-section {
      padding: 16px;
      display: flex;
      gap: 12px;
      background: linear-gradient(180deg, rgba(30,35,50,1) 0%, rgba(20,24,36,0) 100%);
    }
    .prize-box {
      background-color: rgba(0,0,0,0.3);
      border: 1px solid rgba(246, 192, 57, 0.2);
      border-radius: 12px;
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .prize-box .label {
      color: var(--gold);
      font-size: 11px;
      margin-bottom: 4px;
    }
    .prize-box .amount {
      color: var(--gold);
      font-size: 20px;
      font-weight: bold;
    }
    .main-ball {
      width: 70px;
      height: 70px;
      background: radial-gradient(circle at 30% 30%, #ffffff, #d1d5db);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 32px;
      font-weight: 900;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 -5px 10px rgba(0,0,0,0.2);
      position: relative;
    }
    .main-ball::before {
      content: '';
      position: absolute;
      top: 10px;
      width: 4px;
      height: 10px;
      background-color: #ef4444;
    }
    .history-box {
      background-color: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .history-balls {
      display: flex;
      gap: 4px;
    }
    .small-ball {
      width: 24px;
      height: 24px;
      background-color: var(--bg-panel);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid var(--gold);
    }
    .history-box .counter {
      align-self: flex-end;
      font-size: 11px;
      color: var(--gold);
      font-weight: bold;
    }
    .controls-row {
      display: flex;
      justify-content: space-between;
      padding: 0 16px;
      align-items: center;
    }
    .dropdown {
      background-color: var(--bg-panel);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toggle {
      background-color: var(--bg-panel);
      border-radius: 20px;
      display: flex;
      overflow: hidden;
      font-size: 12px;
      font-weight: bold;
    }
    .toggle div {
      padding: 8px 16px;
    }
    .toggle .active {
      background-color: #2b334a;
      color: #93c5fd;
    }
    .game-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .game-area .icon {
      width: 48px;
      height: 48px;
      background-color: var(--bg-panel);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      opacity: 0.5;
    }
    .game-area h2 {
      margin: 0 0 10px 0;
      font-size: 18px;
    }
    .game-area p {
      margin: 0;
      color: var(--text-muted);
      font-size: 13px;
    }
    .bottom-nav {
      display: flex;
      background-color: var(--bg-panel);
      padding: 10px 0;
      padding-bottom: env(safe-area-inset-bottom, 10px);
      align-items: center;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--text-muted);
    }
    .nav-item.active {
      color: var(--gold);
    }
    .nav-item svg {
      width: 20px;
      height: 20px;
    }
    .bingo-btn {
      background-color: #2b334a;
      color: rgba(255,255,255,0.2);
      border: none;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 900;
      margin-right: 16px;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div style="color: #6b7280; display:flex; gap:6px; align-items:center;">
      <span style="color:var(--gold)">▲</span> GAME ROUND #221448
    </div>
    <div class="live-badge">LIVE - 78 PLAYERS</div>
    <div style="color: #6b7280;">🔊</div>
  </div>

  <div class="top-section">
    <div class="prize-box">
      <div class="label">የድል አሸናፊ መጠን</div>
      <div class="amount" id="heroPrize">1336 ETB</div>
    </div>
    
    <div class="main-ball" id="currentNumber">30</div>
    
    <div class="history-box">
      <div class="history-balls" id="calledNumbers">
        <div class="small-ball" style="color: var(--gold);">| 30</div>
      </div>
      <div class="counter">• 1/75</div>
    </div>
  </div>

  <div class="controls-row">
    <div class="dropdown">
      <span style="color:var(--gold)">📊</span> ቁጥሮችን ይከታተሉ <span>⌄</span>
    </div>
    <div class="toggle">
      <div class="active">AUTO</div>
      <div style="color:var(--text-muted)">MANUAL</div>
    </div>
  </div>

  <div class="game-area">
    <div class="icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    </div>
    <h2>ጨዋታው በመካሄድ ላይ ነው...</h2>
    <p>እባክዎን ቀጣዩ ዙር እስኪጀምር ይጠብቁ!</p>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      መነሻ
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
      ደረጃ
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      ፕሮፋይል
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
      ቦርድ
    </div>
    <button class="bingo-btn">BINGO!</button>
  </div>
</body>
</html>
